server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind a reverse proxy: keep redirects relative so the container's own
    # port never leaks into a Location header.
    absolute_redirect off;

    # Security headers (`headers()` in next.config.ts would be a no-op under
    # `output: "export"`, so they live here).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-DNS-Prefetch-Control "on" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;

    # Container health probe.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets are immutable.
    location /_next/static/ {
        # add_header in a location drops the server-level ones, so repeat the
        # only header that matters for assets.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        # `trailingSlash` is false: /foo/ -> /foo.
        rewrite ^(.+)/$ $1 permanent;

        # The export writes route .html files alongside directories of RSC
        # payloads, so .html must be tried before the bare path — otherwise
        # nginx resolves the directory and loops.
        try_files $uri.html $uri/index.html $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
